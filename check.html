<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Site check — Swayam Enterprises</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A66;--gold:#F5B21B;--wash:#F4F6FA;--line:#DCE2EC;--ink:#101828;--grey:#5B6577;
      --ok:#1B7A3E;--bad:#B32218;--warn:#8A6100}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6}
h1,h2{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.wrap{width:min(100% - 2rem,760px);margin:2.5rem auto 5rem}
h1{font-size:1.6rem;margin-bottom:.3rem}
.sub{color:var(--grey);font-size:.93rem;margin:0 0 1.6rem;word-break:break-all}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.3rem 1.4rem;margin-bottom:1rem}
.card h2{font-size:1.02rem;margin-bottom:.9rem}
.row{display:flex;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row:last-child{border-bottom:0}
.dot{width:20px;height:20px;border-radius:50%;flex:none;margin-top:.15rem;display:grid;place-items:center;color:#fff;font-size:.72rem;font-weight:700}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:#E0A106;color:#3A2A00}.dot.wait{background:#9AA3AF}
.txt b{display:block;font-size:.95rem;font-weight:600}
.txt span{display:block;font-size:.85rem;color:var(--grey)}
.txt code{background:var(--wash);padding:.1rem .35rem;border-radius:3px;font-size:.82rem;word-break:break-all}
.summary{border-radius:10px;padding:1rem 1.2rem;font-size:.94rem;margin-bottom:1.4rem}
.summary.ok{background:#EAF7EE;border:1px solid #A9DCB9;color:#155F31}
.summary.bad{background:#FDECEA;border:1px solid #F0B4AC;color:#7C2018}
.summary.wait{background:#EEF1F6;border:1px solid var(--line);color:var(--grey)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.6rem;margin-top:.8rem}
.thumb{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--wash)}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.thumb .cap{font-size:.7rem;padding:.3rem .4rem;color:var(--grey);word-break:break-all}
.thumb.bad{border-color:#F0B4AC}
.btn{display:inline-block;margin-top:1rem;background:var(--navy);color:#fff;padding:.7rem 1.2rem;border-radius:8px;
     font-family:Archivo;font-weight:700;font-size:.92rem;text-decoration:none;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>Site check</h1>
  <p class="sub" id="base"></p>

  <div class="summary wait" id="summary">Running checks…</div>

  <div class="card"><h2>Files</h2><div id="files"></div></div>
  <div class="card"><h2>Settings</h2><div id="settings"></div></div>
  <div class="card"><h2>Photos</h2><div id="photos"></div><div class="thumbs" id="thumbs"></div></div>

  <button class="btn" onclick="location.reload()">Run again</button>
</div>

<script>
const $ = id => document.getElementById(id);
const base = location.href.replace(/check\.html.*$/, '');
$('base').textContent = base;

function row(host, state, title, detail){
  const r = document.createElement('div'); r.className = 'row';
  const d = document.createElement('div'); d.className = 'dot ' + state;
  d.textContent = state === 'ok' ? '✓' : state === 'bad' ? '✕' : state === 'warn' ? '!' : '…';
  const t = document.createElement('div'); t.className = 'txt';
  const b = document.createElement('b'); b.textContent = title;
  const s = document.createElement('span'); s.innerHTML = detail || '';
  t.append(b, s); r.append(d, t); host.append(r);
  return r;
}

let bad = 0, warn = 0;

async function head(path){
  try{
    const r = await fetch(base + path + '?v=' + Date.now(), { cache:'no-store' });
    return r.status;
  }catch(e){ return 0; }
}

const FILES = [
  ['index.html',      true,  'The website itself'],
  ['content.json',    true,  'All the editable text and photo paths'],
  ['admin.html',      true,  'The admin panel'],
  ['visualiser.html', true,  'The floor finish preview'],
  ['auth.json',       false, 'Created by setup.html. Without it, admin login will not work'],
  ['setup.html',      null,  'Should be DELETED once the login is created']
];

(async function run(){
  // ---------- files ----------
  for (const [name, required, why] of FILES){
    const code = await head(name);
    if (name === 'setup.html'){
      if (code === 200){ warn++; row($('files'),'warn', name + ' is still on the site',
        'Anyone can open it. ' + why + '. Delete it from the repository.'); }
      else row($('files'),'ok', name + ' has been removed', 'Correct.');
      continue;
    }
    if (code === 200) row($('files'),'ok', name, why);
    else if (required){ bad++; row($('files'),'bad', name + ' is missing (' + code + ')',
      'Upload this file to the repository. Filenames are case-sensitive — it must be exactly <code>' + name + '</code>, all lowercase.'); }
    else { warn++; row($('files'),'warn', name + ' not found', why); }
  }

  // ---------- content ----------
  let data = null;
  try{
    const r = await fetch(base + 'content.json?v=' + Date.now(), { cache:'no-store' });
    data = await r.json();
    row($('settings'),'ok','content.json is readable','');
  }catch(e){
    bad++;
    row($('settings'),'bad','content.json could not be read','It is missing, or the text inside is not valid JSON. A stray comma will do it.');
  }

  if (data){
    const b = data.business || {};
    const checks = [
      ['phone',        b.phone,        /^\+91\d{10}$/,      'Should look like <code>+919876543210</code> — plus sign, no spaces.'],
      ['phoneDisplay', b.phoneDisplay, /\d/,                'How the number is shown on the page.'],
      ['whatsapp',     b.whatsapp,     /^91\d{10}$/,        'Should look like <code>919876543210</code> — no plus sign, no spaces.'],
      ['email',        b.email,        /^[^@\s]+@[^@\s]+$/, 'Contact email.']
    ];
    for (const [key, val, re, help] of checks){
      if (!val){ bad++; row($('settings'),'bad', key + ' is empty', help); }
      else if (/1234567890|12345 67890/.test(String(val))){
        bad++; row($('settings'),'bad', key + ' is still the placeholder',
          'Currently <code>' + val + '</code>. Change it in the admin, or edit content.json. Every call button is dead until you do.');
      }
      else if (!re.test(String(val))){ warn++; row($('settings'),'warn', key + ' looks wrong',
        'Currently <code>' + val + '</code>. ' + help); }
      else row($('settings'),'ok', key, '<code>' + val + '</code>');
    }
    if (/Add full address/i.test(b.address || '')){ warn++; row($('settings'),'warn','Address is still the placeholder',''); }
    if (/Add GSTIN/i.test(b.gst || '')){ warn++; row($('settings'),'warn','GSTIN is still the placeholder',''); }
  }

  // ---------- photos ----------
  if (data){
    const list = [];
    (data.ba || []).forEach((p,i)=>{
      list.push(['Job ' + (i+1) + ' before', p.before]);
      list.push(['Job ' + (i+1) + ' after',  p.after]);
    });
    (data.gallery || []).forEach((p,i)=> list.push(['Gallery ' + (i+1), p.src]));

    let missing = 0, blank = 0;
    for (const [label, path] of list){
      const card = document.createElement('div');
      card.className = 'thumb';
      if (!path){ blank++; card.classList.add('bad');
        card.innerHTML = '<div style="aspect-ratio:4/3;display:grid;place-items:center;color:#8A6100;font-size:.72rem">not set</div>';
        const c = document.createElement('div'); c.className='cap'; c.textContent = label; card.append(c);
        $('thumbs').append(card); continue;
      }
      const code = await head(path);
      const img = document.createElement('img');
      img.src = base + path + '?v=' + Date.now(); img.alt = label;
      const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = label;
      card.append(img, cap);
      if (code !== 200){ missing++; card.classList.add('bad'); cap.textContent = label + ' — 404'; }
      $('thumbs').append(card);
    }

    if (missing === 0 && blank === 0 && list.length)
      row($('photos'),'ok','All ' + list.length + ' photos load','');
    if (blank){ warn++; row($('photos'),'warn', blank + ' photo slot(s) are empty',
      'Upload them in the admin, then press <b>Publish</b>.'); }
    if (missing){ bad++; row($('photos'),'bad', missing + ' photo(s) are listed but return 404',
      'The path is saved in content.json but the file is not in the repository. Most likely you uploaded in the admin and did not press <b>Publish</b>, or GitHub has not finished rebuilding — wait a minute and run this check again.'); }
  }

  // ---------- summary ----------
  const s = $('summary');
  if (bad){ s.className = 'summary bad';
    s.innerHTML = '<b>' + bad + ' problem(s) found.</b> Fix the red items below. Warnings are worth doing but will not break the site.'; }
  else if (warn){ s.className = 'summary ok';
    s.innerHTML = '<b>No breaking problems.</b> ' + warn + ' warning(s) below are worth clearing up.'; }
  else { s.className = 'summary ok'; s.innerHTML = '<b>Everything checks out.</b>'; }
})();
</script>
</body>
</html>
